name: Pull Requests

on:
  pull_request:
    branches:
      - main

jobs:
  pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Use CI Firebase options
        run: cp lib/firebase_options_ci.dart lib/firebase_options.dart

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build Flutter web
        run: flutter build web --dart-define=USE_EMULATORS=true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Playwright chromium and Firebase CLI
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          npm install -g firebase-tools

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start Firebase emulators
        run: |
          firebase emulators:start --only auth,firestore,storage --import=./firebase-export --project tmillz &
          echo "Waiting for Firestore emulator on port 8080..."
          for i in $(seq 1 60); do curl -s http://localhost:8080 > /dev/null && echo "Emulators ready" && break || sleep 2; done

      - name: Take home screen screenshot
        run: |
          npx serve build/web -p 3000 &
          for i in $(seq 1 30); do curl -s http://localhost:3000 > /dev/null && break || sleep 1; done
          mkdir -p screenshots
          node - << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('http://localhost:3000');
            await page.waitForLoadState('networkidle');
            await page.waitForSelector('flt-glass-pane', { state: 'attached', timeout: 30000 });
            // Press Tab to activate Flutter's accessibility layer (populates flt-semantics in the shadow DOM)
            await page.keyboard.press('Tab');
            // Wait for the 'Posts' section header inside the shadow root — only present once Firestore data has loaded
            await page.waitForFunction(() => {
              const glasspane = document.querySelector('flt-glass-pane');
              if (!glasspane || !glasspane.shadowRoot) return false;
              const nodes = glasspane.shadowRoot.querySelectorAll('flt-semantics');
              return Array.from(nodes).some(el => el.textContent.trim() === 'Posts');
            }, { timeout: 30000 });
            // Clear focus ring before screenshotting
            await page.keyboard.press('Escape');
            await page.screenshot({ path: 'screenshots/home-screen.png' });
            await browser.close();
          })();
          EOF

      - name: Update README with screenshot
        run: |
          python3 - << 'EOF'
          import re, pathlib

          readme        = pathlib.Path('README.md')
          content       = readme.read_text()

          marker_start  = '<!-- screenshot-start -->'
          marker_end    = '<!-- screenshot-end -->'
          image_ref     = '![Home Screen](screenshots/home-screen.png)'

          block   = f'{marker_start}\n{image_ref}\n{marker_end}'
          pattern = re.compile(
              rf'{re.escape(marker_start)}.*?{re.escape(marker_end)}',
              re.DOTALL
          )

          if pattern.search(content):
              # Markers exist — replace whatever is between them
              content = pattern.sub(block, content)
          else:
              # No markers yet — append the block to the end of the file
              content = content.rstrip('\n') + '\n\n' + block + '\n'

          readme.write_text(content)
          EOF

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/home-screen.png README.md
          git diff --staged --quiet || git commit -m "chore: update home screen screenshot [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
